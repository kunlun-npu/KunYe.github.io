# ============================================================
# Kun Ye | Academic Homepage
# Academic Pages / Jekyll / GitHub Pages
# Website: https://kunye.github.io
# ============================================================
# Edit this file in the root of the KunYe.github.io repository.
# Restart a local Jekyll server after changing this configuration.

# ------------------------------------------------------------
# 1. Basic site settings
# ------------------------------------------------------------
locale                   : "en-US"
site_theme               : "air"  # Clean academic style; also supports dark mode

title                    : "Kun Ye"
title_separator          : "|"
name                     : &name "Kun Ye"
description              : &description "Research on fluid–structure–thermal coupling in aerospace vehicles, focusing on computational methods, underlying physical mechanisms, aeroelastic stability, and similarity theory for high-speed and hypersonic flight."

url                      : "https://kunye.github.io"
baseurl                  : ""
repository               : "KunYe/KunYe.github.io"

# ------------------------------------------------------------
# 2. Author information / left sidebar
# ------------------------------------------------------------
author:
  avatar                 : "profile.png"  # Requires images/profile.png in the repository
  name                   : "Kun Ye"
  pronouns               :
  bio                    : "Aerospace multiphysics | Fluid–structure–thermal coupling | Computational methods, coupling mechanisms, and similarity theory"
  location               : "Xi'an, China"
  employer               : "Northwestern Polytechnical University"
  uri                    : "https://kunye.github.io"
  email                  :  # Add your public academic email only if you want it displayed

  # Academic profiles: add only confirmed personal URLs.
  academia               :
  arxiv                  :
  googlescholar          :
  inspire-hep            :
  impactstory            :
  orcid                  :
  semantic               :
  ssrn                   :
  pubmed                 :
  researchgate           :
  scopus                 :
  zotero                 :

  # Code and research software
  bitbucket              :
  codepen                :
  dribbble               :
  github                 : "KunYe"
  kaggle                 :
  stackoverflow          :

  # Social profiles: leave unused accounts blank
  artstation             :
  bluesky                :
  facebook               :
  flickr                 :
  foursquare             :
  goodreads              :
  google_plus            :
  keybase                :
  instagram              :
  lastfm                 :
  linkedin               :
  mastodon               :
  medium                 :
  pinterest              :
  soundcloud             :
  steam                  :
  telegram               :
  tumblr                 :
  twitter                :
  vine                   :
  weibo                  :
  wikipedia              :
  xing                   :
  youtube                :
  zhihu                  :

# ------------------------------------------------------------
# 3. Publication categories
# These keys match the Academic Pages publication templates.
# ------------------------------------------------------------
publication_category:
  books:
    title: "Books and Book Chapters"
  manuscripts:
    title: "Journal Articles"
  conferences:
    title: "Conference Papers"

# ------------------------------------------------------------
# 4. Display options
# ------------------------------------------------------------
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : false
read_more                : "disabled"
talkmap_link             : false

# Academic profile: no visitor comments by default
comments:
  provider               : false

atom_feed:
  hide                   : false
  path                   :

# ------------------------------------------------------------
# 5. Search engine and social metadata
# ------------------------------------------------------------
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

twitter:
  username               :
facebook:
  username               :
  app_id                 :
  publisher              :

# Add images/og-image.png later if you create a social preview image.
og_image                 :
og_description           : *description
social:
  type                   : "Person"
  name                   : *name
  links:
    - "https://github.com/KunYe"

# Optional: configure web analytics after obtaining a measurement ID.
analytics:
  provider               : "false"
  google:
    tracking_id          :

# ------------------------------------------------------------
# 6. Content files and Jekyll processing
# ------------------------------------------------------------
include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# ------------------------------------------------------------
# 7. Academic content collections
# ------------------------------------------------------------
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Layout defaults for each content type
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: false

  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: false

# ------------------------------------------------------------
# 8. Build, plugins and archive settings
# ------------------------------------------------------------
sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Asia/Shanghai

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development
